name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping Supabase to keep project active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -sf -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            || echo "Ping failed - project may be paused"