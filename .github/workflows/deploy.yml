name: CI & Deploy

# Deploys database migrations and Edge Functions to the linked Supabase
# project whenever the backend layer changes or on manual dispatch.
# Also runs lint, typecheck, and unit tests on every push.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN     — personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID       — project reference (from the project dashboard URL)
#   SUPABASE_DB_PASSWORD      — database password for `supabase db push`
#   DESIGNER_JWT_SECRET       — HS256 signing secret for designer JWTs (>= 32 random chars)
#   GOOGLE_CLIENT_ID          — Drive OAuth 2.0 client id
#   GOOGLE_CLIENT_SECRET      — Drive OAuth 2.0 client secret
#   GOOGLE_REFRESH_TOKEN      — Drive OAuth 2.0 refresh token
#   GOOGLE_DRIVE_MEDIA_FOLDER_ID
#
# The Supabase_* variables the functions use (SUPABASE_URL,
# SUPABASE_PUBLISHABLE_KEYS, SUPABASE_SECRET_KEYS) are injected by Supabase
# and cannot be set here — a secret name must not start with `SUPABASE_`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

  deploy:
    name: Deploy Supabase
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push

      - name: Set edge function secrets
        run: |
          # Only set a secret when the repository secret actually has a value.
          # An empty value here would clobber a working project secret (e.g.
          # DESIGNER_JWT_SECRET set via the CLI) and break logins on every push.
          set_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              supabase secrets set "${name}=${value}"
            else
              echo "::warning::Skipping ${name}: repository secret not set — leaving the existing project value untouched"
            fi
          }
          set_secret DESIGNER_JWT_SECRET "${{ secrets.DESIGNER_JWT_SECRET }}"
          set_secret GOOGLE_CLIENT_ID "${{ secrets.GOOGLE_CLIENT_ID }}"
          set_secret GOOGLE_CLIENT_SECRET "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          set_secret GOOGLE_REFRESH_TOKEN "${{ secrets.GOOGLE_REFRESH_TOKEN }}"
          set_secret GOOGLE_DRIVE_MEDIA_FOLDER_ID "${{ secrets.GOOGLE_DRIVE_MEDIA_FOLDER_ID }}"

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify deployments
        run: |
          supabase functions list
          echo "Migrations and edge functions deployed to $SUPABASE_PROJECT_ID"